{% extends "inventory/base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categories</h2>
    <a href="{% url 'inventory:category_create' %}" class="btn btn-primary">+ Add Category</a>
</div>
<div class="card card-stat">
    <table class="table mb-0">
        <thead><tr><th>Name</th><th></th></tr></thead>
        <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td><a href="{% url 'inventory:category_edit' category.pk %}" class="btn btn-sm btn-outline-primary">Edit</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="2" class="text-center text-muted py-3">No categories found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
